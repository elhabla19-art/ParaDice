<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ParaDice</title>
    
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="favicon.ico">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ============================================ -->
    <!-- LOBBY PRINCIPAL -->
    <!-- ============================================ -->
    <div id="lobbyModal" class="modal-overlay">
        <div class="modal-box">
            <h2>ParaDice</h2>
            <p>Selecciona un modo de juego</p>
            <div class="input-group">
                <label>Tu Nombre:</label>
                <input type="text" id="playerName" placeholder="Ej. Leo" maxlength="10">
            </div>
            <div class="modal-buttons">
                <div class="row-btns">
                    <button class="modal-btn btn-primary" onclick="window.createRoom()">Crear Sala</button>
                    <button class="modal-btn btn-secondary" onclick="window.showJoinModal()">Unirse</button>
                </div>
                <button class="modal-btn btn-outline" onclick="window.playSolo()" style="margin-top: 10px;">Jugar Solo (Local)</button>
            </div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- UNIRSE A SALA -->
    <!-- ============================================ -->
    <div id="joinModal" class="modal-overlay">
        <div class="modal-box">
            <h2>Unirse a Sala</h2>
            <p>Pide el codigo al creador de la sala</p>
            <div class="input-group">
                <label>Codigo de la Sala (4 letras/numeros):</label>
                <input type="text" id="roomCodeInput" placeholder="ABCD" maxlength="4" style="text-transform: uppercase;">
            </div>
            <div class="modal-buttons row-btns">
                <button class="modal-btn btn-outline" onclick="window.backToLobby()">Volver</button>
                <button class="modal-btn btn-secondary" onclick="window.joinRoom()">Entrar</button>
            </div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- CARGANDO -->
    <!-- ============================================ -->
    <div id="loadingModal" class="modal-overlay">
        <div class="modal-box" style="background: transparent; border: none; box-shadow: none;">
            <h2 id="loadingText">Conectando...</h2>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- ZOOM DE CARTA -->
    <!-- ============================================ -->
    <div id="zoomModal" class="modal-overlay" style="display: none; z-index: 3000;">
        <div class="modal-box" style="max-width: 520px; background: rgba(0,0,0,0.95);">
            <div style="text-align: right; margin-bottom: 10px;">
                <button onclick="window.cerrarZoom()" style="background: transparent; border: none; color: white; font-size: 2rem; cursor: pointer; padding: 0 10px;">X</button>
            </div>
            <div id="zoomContent" style="display: flex; gap: 20px; justify-content: center; align-items: center; min-height: 200px; flex-wrap: wrap;">
                <div style="flex: 0 0 auto;">
                    <img id="zoomImage" src="" alt="Carta ampliada" style="max-width: 180px; max-height: 250px; border-radius: 8px; display: block;">
                </div>
                <div id="zoomCasillas" style="display: flex; flex-direction: column; gap: 8px; min-width: 50px; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 10px; border: 1px solid rgba(255,255,255,0.08); align-items: center;">
                </div>
            </div>
            <div id="zoomText" style="text-align: center; color: #aaa; margin-top: 10px; font-size: 0.9rem;"></div>
            <div id="zoomAcciones" style="margin-top: 10px; text-align: center;"></div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- MODAL DE HABILIDAD -->
    <!-- ============================================ -->
    <div id="habilidadModal" class="modal-overlay" style="display: none; z-index: 4000;">
        <div class="modal-box" style="max-width: 400px; background: rgba(0,0,0,0.95);">
            <div style="text-align: right; margin-bottom: 10px;">
                <button onclick="window.cerrarHabilidad()" style="background: transparent; border: none; color: white; font-size: 2rem; cursor: pointer; padding: 0 10px;">X</button>
            </div>
            <div id="habilidadContent">
            </div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- MODAL ESPECIAL -->
    <!-- ============================================ -->
    <div id="especialModal" class="modal-overlay" style="display: none; z-index: 4000;">
        <div class="modal-box" style="max-width: 450px; background: rgba(0,0,0,0.95);">
            <div style="text-align: right; margin-bottom: 10px;">
                <button onclick="window.cerrarEspecial()" style="background: transparent; border: none; color: white; font-size: 2rem; cursor: pointer; padding: 0 10px;">X</button>
            </div>
            <div id="especialContent">
            </div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- MODAL DE PODIO (FIN DEL JUEGO) -->
    <!-- ============================================ -->
    <div id="podioModal" class="modal-overlay" style="display: none; z-index: 5000;">
        <div class="modal-box" style="max-width: 520px; background: rgba(0,0,0,0.95);">
            <div id="podioContent">
                <!-- Generado por JavaScript -->
            </div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- MODAL DE COMPLETAS -->
    <!-- ============================================ -->
    <div id="completasModal" class="modal-overlay" style="display: none; z-index: 4500;">
        <div class="modal-box" style="max-width: 520px; background: rgba(0,0,0,0.95);">
            <div style="text-align: right; margin-bottom: 10px;">
                <button onclick="window.cerrarCompletas()" style="background: transparent; border: none; color: white; font-size: 2rem; cursor: pointer; padding: 0 10px;">X</button>
            </div>
            <div id="completasContent">
                <!-- Generado por JavaScript -->
            </div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- MODAL DE HISTORIAL -->
    <!-- ============================================ -->
    <div id="historialModal" class="modal-overlay" style="display: none; z-index: 4500;">
        <div class="modal-box" style="max-width: 450px; background: rgba(0,0,0,0.95);">
            <div style="text-align: right; margin-bottom: 10px;">
                <button onclick="window.cerrarHistorial()" style="background: transparent; border: none; color: white; font-size: 2rem; cursor: pointer; padding: 0 10px;">X</button>
            </div>
            <div id="historialContent">
                <!-- Generado por JavaScript -->
            </div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- UI DEL JUEGO -->
    <!-- ============================================ -->
    <header>
        <h1>ParaDice</h1>
        <div id="roomInfoDisplay" class="room-info" style="display: none;"></div>
    </header>

    <div class="app-container">
        <!-- AREA DE JUEGO -->
        <div class="game-area">
            <!-- Tablero -->
            <div class="board-container">
                <div class="board" id="game-board"></div>
            </div>

            <!-- Cartas visibles horizontales (sin label) -->
            <div class="cartas-visibles-horizontal">
                <div id="cartas-visibles-container" class="cartas-horizontal">
                    <div class="carta-visible vacia" data-index="0">Vacio</div>
                    <div class="carta-visible vacia" data-index="1">Vacio</div>
                    <div class="carta-visible vacia" data-index="2">Vacio</div>
                    <div class="carta-visible vacia" data-index="3">Vacio</div>
                </div>
            </div>

            <!-- Controles -->
            <div class="controles-juego">
                <button class="btn-control btn-repartir" onclick="window.repartirCartas()">Casetas</button>
                <button class="btn-control btn-especial" onclick="window.usarCartaEspecial()">Bolsa</button>
                <button class="btn-control btn-reiniciar" onclick="window.reiniciarTablero()">Reiniciar</button>
                <div class="info-mazo">
                    <span>Casetas: <strong id="mazo-restantes">45</strong></span>
                </div>
                <div class="info-mazo">
                    <span>Bolsa: <strong id="mazo-especial-restantes">9</strong></span>
                </div>
            </div>
        </div>

        <!-- TUS CARTAS -->
        <div class="jugador-cartas-container">
            <div class="cartas-header">
                <span class="header-label">Mis Casetas</span>
            </div>
            
            <div class="cartas-grid">
                <!-- Mi Mano -->
                <div id="jugador-cartas-container" class="cartas-mano">
                    <div class="carta-jugador vacia" data-index="0">Vacio</div>
                    <div class="carta-jugador vacia" data-index="1">Vacio</div>
                    <div class="carta-jugador vacia" data-index="2">Vacio</div>
                    <div class="carta-jugador vacia" data-index="3">Vacio</div>
                    <div class="carta-jugador vacia" data-index="4">Vacio</div>
                </div>
            </div>
        </div>

        <!-- PANEL LATERAL -->
        <div class="side-panel">
            <!-- Panel de Estado (clickeable para abrir completas) -->
            <div class="status-panel">
                <div id="status-panel-content" class="status-grid">
                    <!-- Generado por JavaScript -->
                </div>
            </div>

            <!-- Jugadores (plegable) -->
            <div class="leaderboard" id="leaderboardPanel">
                <div class="leaderboard-header" onclick="window.toggleLeaderboard()">
                    <h3>Jugadores</h3>
                    <div class="header-controls">
                        <button id="btnRefrescar" onclick="event.stopPropagation(); window.refrescarSincronizacion();" 
                                class="btn-refrescar" title="Sincronizar con otros jugadores">
                            R
                        </button>
                        <span id="toggleIcon">▲</span>
                    </div>
                </div>
                <div id="leaderboardContent" class="leaderboard-content">
                    <div id="playersList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- SCRIPTS -->
    <!-- ============================================ -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
